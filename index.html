<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fa">
<title>Tobin · Dashboard</title>
<style>
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --border: #e5e9f0;
  --border-strong: #d1d8e3;
  --text: #1a2030;
  --muted: #5e6b85;
  --muted2: #94a0b8;
  --blue: #2563eb;
  --blue-soft: #eff4ff;
  --blue-dark: #1e40af;
  --green: #16a34a;
  --green-soft: #ecfdf5;
  --green-dark: #15803d;
  --amber: #c2680c;
  --amber-soft: #fef6e7;
  --amber-dark: #92400e;
  --red: #c63232;
  --red-soft: #fef1f1;
  --red-dark: #9b1c1c;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(15, 25, 50, 0.04);
  --shadow-md: 0 4px 16px rgba(15, 25, 50, 0.08);
  --shadow-lg: 0 12px 40px rgba(15, 25, 50, 0.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: inherit; text-decoration: none; }

.view { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
.view.hidden { display: none; }

/* ── Hero ─────────────────────────────────────────────── */
.hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.hero-greet { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
.hero-date { font-size: 16px; color: var(--muted); text-transform: capitalize; }
.hero-meta { font-size: 13px; color: var(--muted2); display: inline-flex; align-items: center; gap: 6px; }
.hero-actions { display: flex; gap: 8px; align-items: center; }
.linkbtn { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: var(--radius-sm); transition: background 0.15s; }
.linkbtn:hover { background: rgba(15, 25, 50, 0.05); color: var(--text); }

/* ── Layout ───────────────────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
.card-h {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  display: inline-flex; align-items: center; gap: 8px;
}
.card-h-icon { font-size: 14px; color: var(--muted2); }

/* ── Buttons ──────────────────────────────────────────── */
.btn-soft {
  font-size: 12.5px;
  padding: 6px 11px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.btn-soft:hover { background: var(--surface-soft); color: var(--text); }
.btn-primary {
  font-size: 13px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  background: var(--blue);
  color: white;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.9; }
.btn-ghost-row {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 0;
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px dashed var(--border-strong);
  transition: color 0.15s;
}
.btn-ghost-row:hover { color: var(--blue); }
.btn-expand {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 0;
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  transition: color 0.15s;
}
.btn-expand:hover { color: var(--blue); }

/* ── Agenda ───────────────────────────────────────────── */
.evt { padding: 12px 0; border-top: 1px solid var(--border); }
.evt:first-of-type { border-top: none; padding-top: 0; }
.evt-main { display: flex; align-items: center; gap: 14px; font-size: 15px; }
.evt-time { font-size: 13px; color: var(--muted2); min-width: 48px; font-variant-numeric: tabular-nums; }
.evt-title { flex: 1; }
.evt-note-btn {
  color: var(--muted2);
  font-size: 17px;
  padding: 4px 6px;
  border-radius: 4px;
  transition: all 0.15s;
}
.evt-note-btn:hover { color: var(--blue); background: var(--blue-soft); }
.evt-note-btn.has { color: var(--blue); }

/* ── Todos ────────────────────────────────────────────── */
.todo {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
  font-size: 15px;
}
.todo:first-of-type { border-top: none; padding-top: 0; }
.todo input[type="checkbox"] {
  width: 18px; height: 18px; flex-shrink: 0;
  accent-color: var(--blue);
  cursor: pointer;
}
.todo.done .todo-text { text-decoration: line-through; color: var(--muted2); }
.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  min-width: 42px;
  text-align: center;
  letter-spacing: 0.02em;
}
.badge-alta { background: var(--red-soft); color: var(--red-dark); }
.badge-media { background: var(--amber-soft); color: var(--amber-dark); }
.badge-baja { background: var(--blue-soft); color: var(--blue-dark); }
.todo-text { flex: 1; }

/* ── Health ───────────────────────────────────────────── */
.health-refresh { display: flex; gap: 6px; }
.metrics-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.metric {
  background: var(--surface-soft);
  border-radius: var(--radius);
  padding: 14px 16px;
  border: 1px solid transparent;
  transition: background 0.2s, border-color 0.2s;
}
.metric-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.metric-val { font-size: 26px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }
.metric-sub { font-size: 12px; color: var(--muted2); margin-top: 4px; }
.metric.zone-green  { background: var(--green-soft); border-color: rgba(22, 163, 74, 0.18); }
.metric.zone-yellow { background: var(--amber-soft); border-color: rgba(194, 104, 12, 0.22); }
.metric.zone-red    { background: var(--red-soft);   border-color: rgba(198, 50, 50, 0.22); }
.metric.zone-green  .metric-val, .metric.zone-green  .metric-sub-strong { color: var(--green-dark); }
.metric.zone-yellow .metric-val, .metric.zone-yellow .metric-sub-strong { color: var(--amber-dark); }
.metric.zone-red    .metric-val, .metric.zone-red    .metric-sub-strong { color: var(--red-dark); }
.metric-sub-strong { font-size: 13px; font-weight: 500; margin-top: 4px; }
.section-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted2);
  margin: 6px 0 4px;
}
.act-row {
  display: flex; align-items: center; gap: 14px;
  padding: 11px 0;
  border-top: 1px solid var(--border);
  font-size: 14.5px;
}
.act-row:first-of-type { border-top: none; padding-top: 8px; }
.act-icon { font-size: 20px; color: var(--muted); width: 24px; text-align: center; }
.act-name { flex: 1; font-weight: 500; }
.act-name-sub { font-size: 11px; color: var(--muted2); font-weight: 400; margin-left: 2px; }
.act-vals { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; }
.act-vals .sep { margin: 0 7px; color: var(--muted2); }
.zone-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.zone-dot.zone-green  { background: var(--green); }
.zone-dot.zone-yellow { background: var(--amber); }
.zone-dot.zone-red    { background: var(--red); }
.act-row.zone-green  .act-vals { color: var(--green-dark); font-weight: 500; }
.act-row.zone-yellow .act-vals { color: var(--amber-dark); font-weight: 500; }
.act-row.zone-red    .act-vals { color: var(--red-dark); font-weight: 500; }

/* ── Daily notes ──────────────────────────────────────── */
.notes-area {
  background: var(--surface-soft);
  border-radius: var(--radius);
  padding: 16px;
  min-height: 140px;
}
.note-line { padding: 4px 0; font-size: 15px; }
.note-check { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; font-size: 15px; }
.note-check input { margin-top: 5px; flex-shrink: 0; width: 17px; height: 17px; accent-color: var(--blue); cursor: pointer; }
.note-check.done span:last-child { text-decoration: line-through; color: var(--muted2); }
.from-yesterday {
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--amber-soft);
  color: var(--amber-dark);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 8px;
  vertical-align: 2px;
}
.note-add-row { display: flex; gap: 8px; margin-top: 10px; }
.note-add-input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 14px;
  background: white;
  outline: none;
  transition: border-color 0.15s;
}
.note-add-input:focus { border-color: var(--blue); }
.note-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
.note-row > .note-content { flex: 1; min-width: 0; }
.note-delete {
  opacity: 0;
  padding: 4px 6px;
  font-size: 13px;
  color: var(--muted2);
  border-radius: 4px;
  transition: opacity 0.15s, color 0.15s, background 0.15s;
  flex-shrink: 0;
  line-height: 1;
}
.note-delete { opacity: 0.4; }
.note-row:hover .note-delete { opacity: 0.7; }
.note-row .note-delete:hover { opacity: 1; color: var(--red); background: var(--red-soft); }
.note-longform {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  min-width: 0;
  overflow: hidden;
}
.note-longform:hover { border-color: var(--blue); background: var(--blue-soft); }
.note-longform-icon { color: var(--muted); font-size: 15px; flex-shrink: 0; }
.note-longform-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.note-longform-title { font-weight: 500; font-size: 14.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.note-longform-empty { color: var(--muted2); font-weight: 400; font-style: italic; }
.note-longform-preview { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.modal-title-input {
  font-size: 18px;
  font-weight: 600;
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  padding: 0;
  margin-bottom: 5px;
  color: var(--text);
  font-family: inherit;
  letter-spacing: -0.01em;
}
.modal-title-input::placeholder { color: var(--muted2); font-weight: 400; }
.note-archive { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.archive-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13.5px; color: var(--muted); }
.archive-row .check-icon { color: var(--green); font-size: 14px; }
.archive-row .time { font-size: 11.5px; color: var(--muted2); margin-left: 4px; }
.autosave { font-size: 12px; color: var(--muted2); display: inline-flex; align-items: center; gap: 4px; }

/* ── Modal ────────────────────────────────────────────── */
.modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 60px 20px; overflow-y: auto; }
.modal.open { display: flex; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(15, 25, 50, 0.42); backdrop-filter: blur(2px); }
.modal-card {
  position: relative;
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 560px;
  padding: 22px 26px 18px;
  box-shadow: var(--shadow-lg);
  z-index: 1;
}
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.modal-title { font-size: 18px; font-weight: 600; line-height: 1.3; margin-bottom: 5px; }
.modal-meta { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.modal-close { font-size: 20px; color: var(--muted2); padding: 4px; line-height: 1; transition: color 0.15s; }
.modal-close:hover { color: var(--text); }
.modal-body { border-top: 1px solid var(--border); padding-top: 14px; min-height: 260px; }
.section-mini {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted2);
  margin: 0 0 6px;
}
.modal-textarea {
  width: 100%;
  min-height: 90px;
  border: none;
  outline: none;
  resize: vertical;
  font-size: 14.5px;
  line-height: 1.65;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  margin-bottom: 14px;
}
.modal-textarea::placeholder { color: var(--muted2); font-style: italic; }
.modal-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12.5px; flex-wrap: wrap; }

/* ── Add event modal ──────────────────────────────────── */
.field { display: block; margin-bottom: 14px; }
.field-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; display: block; font-weight: 500; }
.field-input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  background: white;
  outline: none;
  transition: border-color 0.15s;
}
.field-input:focus { border-color: var(--blue); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Past notes view ──────────────────────────────────── */
.back-btn {
  font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 10px; border-radius: var(--radius-sm); margin-bottom: 16px;
  transition: all 0.15s;
}
.back-btn:hover { background: var(--surface-soft); color: var(--text); }
.pn-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
.pn-title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 10px; }
.pn-count { font-size: 13px; color: var(--muted2); }
.search-wrap { position: relative; margin-bottom: 24px; }
.search-input {
  width: 100%;
  padding: 11px 14px 11px 40px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14.5px;
  background: var(--surface);
  outline: none;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--blue); }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted2); font-size: 16px; pointer-events: none; }
.pn-group {
  font-size: 11px; font-weight: 600;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 18px 0 8px;
}
.pn-group:first-of-type { margin-top: 0; }
.pn-row {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  padding: 14px 4px;
  border-top: 1px solid var(--border);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background 0.15s;
}
.pn-row:hover { background: var(--surface-soft); }
.pn-row-content { min-width: 0; flex: 1; }
.pn-row-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.pn-row-preview { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.pn-row-date { font-size: 12.5px; color: var(--muted2); white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 2px; }
.pn-empty { padding: 40px 0; text-align: center; color: var(--muted2); font-size: 14px; }
.pn-row-delete {
  opacity: 0;
  padding: 4px 8px;
  font-size: 14px;
  color: var(--muted2);
  border-radius: 4px;
  transition: opacity 0.15s, color 0.15s, background 0.15s;
  background: transparent;
  border: none;
  cursor: pointer;
  align-self: center;
}
.pn-row:hover .pn-row-delete { opacity: 0.55; }
.pn-row-delete:hover { opacity: 1 !important; color: var(--red); background: var(--red-soft); }
@media (hover: none) { .pn-row-delete { opacity: 0.4; } }

/* Panel header link (pequeño) */
.panel-link {
  font-size: 11.5px;
  color: var(--muted);
  cursor: pointer;
  background: none;
  border: none;
  padding: 5px 9px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: color 0.15s, background 0.15s;
  font-family: inherit;
}
.panel-link:hover { color: var(--blue); background: var(--blue-soft); }
.panel-actions { display: inline-flex; gap: 4px; align-items: center; }

/* Botón "+" del input de notas */
.btn-add-note {
  background: var(--blue);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  width: 36px;
  height: 36px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
  flex-shrink: 0;
  font-size: 18px;
  line-height: 1;
}
.btn-add-note:hover { opacity: 0.9; }

/* ── Icons (inline SVG names) ─────────────────────────── */
.ic { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; }
</style>
</head>
<body>

<main id="dashboard-view" class="view">

  <div class="hero">
    <div>
      <h1 class="hero-greet" id="hero-greet">Buenos días, Cristobal</h1>
      <p class="hero-date" id="hero-date">—</p>
    </div>
    <div class="hero-actions">
      <button class="linkbtn" id="open-past-notes">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span>Notas pasadas</span>
      </button>
      <span class="hero-meta">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="hero-clock">—</span>
      </span>
    </div>
  </div>

  <div class="grid-2">
    <section class="card" id="agenda-card">
      <div class="card-head">
        <span class="card-h">
          <svg class="ic card-h-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Agenda de hoy
        </span>
        <div class="panel-actions">
          <button class="panel-link" id="agenda-past-notes" title="Ver notas de reuniones pasadas">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            <span>Notas pasadas</span>
          </button>
          <button class="btn-soft" id="btn-add-event">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Agregar
          </button>
        </div>
      </div>
      <div id="agenda-list"></div>
      <button class="btn-ghost-row" onclick="openAddEventModal()">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Agregar evento al calendario
      </button>
    </section>

    <section class="card" id="todos-card">
      <div class="card-head">
        <span class="card-h">

/* ═══════════════════════════════════════════════════════════════

const CONFIG = {

    ],
  },
  dailyNotes: [
    { id: 'n1', tipo: 'texto', texto: 'Preparar pitch para reunión Tantauco', creado_en_fecha: '2026-05-18' },
    { id: 'n2', tipo: 'check', texto: 'Revisar memo Acme antes de las 11', completado: false, creado_en_fecha: '2026-05-17' },
    { id: 'n3', tipo: 'check', texto: 'Mandar follow-up a 3 fondos LP', completado: false, creado_en_fecha: '2026-05-18' },
    { id: 'n4', tipo: 'check', texto: 'Llamar a Maca por tema viaje', completado: false, creado_en_fecha: '2026-05-16' },
    { id: 'n5', tipo: 'longform', titulo: 'Resumen Q1 Tantauco', cuerpo: 'Cerramos Q1 con 4 nuevas inversiones (Acme, Beta, Tropic y Delta).\n\nKey points:\n- Acme: deal cerrado en abril, $500k a 5% equity\n- Beta: en due diligence final, esperamos cerrar mayo\n- Tropic: pendiente segunda call, co-invest con Felipe\n- Delta: pasamos, no convenció el equipo\n\nNext steps Q2:\n- Cerrar Beta\n- Pipeline review semanal con el equipo\n- Preparar comité mayo con LPs', creado_en_fecha: '2026-05-18' },

/* ═══════════════════════════════════════════════════════════════
   DATA LAYER — funciones que envuelven mock o fetch real
   ═══════════════════════════════════════════════════════════════ */
const api = {
  async loadCalendar() {
    if (CONFIG.useMockData) return MOCK_DATA.calendar;
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/calendar/today`, { headers: authHeaders() });
    return r.json();
  },
  async createEvent(payload) {
    if (CONFIG.useMockData) { MOCK_DATA.calendar.push({ ...payload, id: 'mock' + Date.now(), hasNote: false }); return; }
    await fetch(`${CONFIG.botApiBase}/dashboard/calendar/event`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  },
  async loadTodos(limit = 3, offset = 0) {
    if (CONFIG.useMockData) {
      const pendientes = MOCK_DATA.todos.filter(t => t.estado === 'Pendiente');
      const orderUrg = { 'Alta': 0, 'Media': 1, 'Baja': 2 };
      pendientes.sort((a, b) => orderUrg[a.urgencia] - orderUrg[b.urgencia]);
      return { items: pendientes.slice(offset, offset + limit), total: pendientes.length };
    }
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/tasks?limit=${limit}&offset=${offset}`, { headers: authHeaders() });
    return r.json();
  },
  async completeTodo(id) {
    if (CONFIG.useMockData) { const t = MOCK_DATA.todos.find(x => x.id === id); if (t) t.estado = 'Completada'; return; }
    await fetch(`${CONFIG.botApiBase}/dashboard/tasks/${id}`, { method: 'PATCH', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: 'Completada' }) });
  },
  async loadHealth() {
    if (CONFIG.useMockData) return MOCK_DATA.health;
    const r = await fetch(`${CONFIG.healthApiBase}/dashboard/health/today`, { headers: authHeaders() });
    return r.json();
  },
  async refreshGarmin() {
    if (CONFIG.useMockData) { await new Promise(r => setTimeout(r, 800)); return MOCK_DATA.health; }
    const r = await fetch(`${CONFIG.healthApiBase}/dashboard/garmin/refresh`, { method: 'POST', headers: authHeaders() });
    return r.json();
  },
  async refreshWhoop() {
    if (CONFIG.useMockData) { await new Promise(r => setTimeout(r, 800)); return MOCK_DATA.health; }
    const r = await fetch(`${CONFIG.healthApiBase}/dashboard/whoop/refresh`, { method: 'POST', headers: authHeaders() });
    return r.json();
  },
  async loadDailyNotes(fecha) {
    if (CONFIG.useMockData) return { items: MOCK_DATA.dailyNotes, archive: MOCK_DATA.dailyNotesArchive };
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/daily-notes/${fecha}`, { headers: authHeaders() });
    return r.json();
  },
  async saveDailyNotes(fecha, items, archive) {
    if (CONFIG.useMockData) { MOCK_DATA.dailyNotes = items; MOCK_DATA.dailyNotesArchive = archive; return; }
    await fetch(`${CONFIG.botApiBase}/dashboard/daily-notes/${fecha}`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ items, archive }) });
  },
  async loadEventNote(eventId) {
    if (CONFIG.useMockData) return MOCK_DATA.eventNotes[eventId] || { prep: '', durante: '' };
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/event-notes/${eventId}`, { headers: authHeaders() });
    return r.json();
  },
  async saveEventNote(eventId, prep, durante, eventTitle, eventStart) {
    if (CONFIG.useMockData) { MOCK_DATA.eventNotes[eventId] = { prep, durante }; return; }
    await fetch(`${CONFIG.botApiBase}/dashboard/event-notes/${eventId}`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ prep, durante, event_title: eventTitle, event_start: eventStart }) });
  },
  async loadPastNotes(search = '') {
    if (CONFIG.useMockData) {
      const s = search.toLowerCase();
      return MOCK_DATA.pastNotes.filter(n =>
        !s || n.title.toLowerCase().includes(s) || n.preview.toLowerCase().includes(s) || n.date.includes(s)
      );
    }
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/event-notes?search=${encodeURIComponent(search)}`, { headers: authHeaders() });
    return r.json();
  },
  async deleteEventNote(eventId) {
    if (CONFIG.useMockData) {
      MOCK_DATA.pastNotes = MOCK_DATA.pastNotes.filter(n => n.event_id !== eventId);
      delete MOCK_DATA.eventNotes[eventId];
      return;
    }

function authHeaders() { return CONFIG.apiKey ? { 'x-api-key': CONFIG.apiKey } : {}; }

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */
const DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const SHORT_DAYS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const SHORT_MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function formatFullDate(d) { return `${DAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]} de ${d.getFullYear()}`; }
function formatShortDate(iso) { const d = new Date(iso + 'T00:00:00'); const today = new Date(); const sameMonth = d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear(); return sameMonth ? `${SHORT_DAYS[d.getDay()]} ${d.getDate()}` : `${d.getDate()} ${SHORT_MONTHS[d.getMonth()]}`; }
function formatClock(d) { return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function daysBetween(isoOld, isoNew) { const a = new Date(isoOld + 'T00:00:00'); const b = new Date(isoNew + 'T00:00:00'); return Math.round((b - a) / (1000 * 60 * 60 * 24)); }
function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }
function uid() { return 'i' + Math.random().toString(36).slice(2, 9); }

/* ═══════════════════════════════════════════════════════════════
   RENDER: HEALTH
   ═══════════════════════════════════════════════════════════════ */
function recoveryZone(score) {
  if (score >= 67) return 'green';
  if (score >= 34) return 'yellow';
  return 'red';
}
function sleepZone(hours, minutes) {
  const total = hours + (minutes || 0) / 60;
  if (total >= 6) return 'green';
  if (total >= 5) return 'yellow';
  return 'red';
}
function gymZone(weeklyCount) {
  if (weeklyCount >= 3) return 'green';
  if (weeklyCount === 2) return 'yellow';
  return 'red';
}

async function renderHealth() {
  const h = await api.loadHealth();
  const rZone = recoveryZone(h.recovery || 0);
  const sZone = sleepZone(h.sleep_hours || 0, h.sleep_minutes || 0);
  const bienestar = document.getElementById('bienestar-block');
  bienestar.innerHTML = `
    <div class="metric zone-${rZone}">
      <p class="metric-label">Recovery (Whoop)</p>
      <p class="metric-val">${h.recovery}%</p>
      <p class="metric-sub-strong">${h.recovery_zone}</p>
    </div>
    <div class="metric zone-${sZone}">
      <p class="metric-label">Sueño anoche</p>
      <p class="metric-val">${h.sleep_hours}h ${h.sleep_minutes}m</p>
      <p class="metric-sub-strong">Score ${h.sleep_score}</p>
    </div>
  `;
  const visible = h.activities.filter(a => a.hoy || a.semana);
  const act = document.getElementById('actividad-list');
  if (visible.length === 0) {
    act.innerHTML = '<p style="color: var(--muted2); font-size: 13px; padding: 10px 0;">Sin actividad registrada</p>';
    return;
  }
  act.innerHTML = visible.map(a => {
    const partes = [];
    if (a.hoy) partes.push(`hoy ${a.hoy.val} ${a.hoy.unit}${a.hoy.val !== 1 && a.hoy.unit === 'sesión' ? 'es' : ''}`);
    if (a.semana) partes.push(`7d ${a.semana.val} ${a.semana.unit}${a.semana.val !== 1 && a.semana.unit === 'sesión' ? 'es' : ''}`);
    let zoneClass = '';
    let dot = '';
    if (a.categoria === 'Gym') {
      const weekly = a.semana?.val || 0;
      const z = gymZone(weekly);
      zoneClass = ` zone-${z}`;
      dot = `<span class="zone-dot zone-${z}" aria-label="zona ${z}"></span>`;
    }
    return `
      <div class="act-row${zoneClass}">
        <span class="act-icon">${iconFor(a.icon)}</span>
        <span class="act-name">${a.categoria}${a.source ? `<span class="act-name-sub"> (${a.source})</span>` : ''}</span>
        <span class="act-vals">${partes.join('<span class="sep">·</span>')}${dot}</span>
      </div>
    `;
  }).join('');
}
function iconFor(name) {
  const icons = {
    run: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M5 22l5-10 4 3 4-6"/><path d="M9 7l3 2 3-1"/></svg>',
    bike: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="4"/><circle cx="18" cy="17" r="4"/><path d="M6 17l4-9h5l3 9M10 8h4"/></svg>',
    swim: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18c2 0 2-1 4-1s2 1 4 1 2-1 4-1 2 1 4 1 2-1 4-1"/><path d="M2 14c2 0 2-1 4-1s2 1 4 1 2-1 4-1 2 1 4 1 2-1 4-1"/><circle cx="17" cy="7" r="2"/></svg>',
    gym: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg>',
  };
  return icons[name] || icons.run;
}

/* ═══════════════════════════════════════════════════════════════
   RENDER: DAILY NOTES
   ═══════════════════════════════════════════════════════════════ */
async function loadNotes() {
  try {
    const data = await api.loadDailyNotes(state.todayISO);
    state.notes = Array.isArray(data?.items) ? data.items : [];
    state.notesArchive = Array.isArray(data?.archive) ? data.archive : [];
  } catch (e) {
    console.error('loadNotes error:', e);
    state.notes = [];
    state.notesArchive = [];
  }
  renderNotes();
}
function renderNotes() {
  const el = document.getElementById('notes-list');
  const delIcon = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
  const longformIcon = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H10M16 17H10"/></svg>`;
  el.innerHTML = state.notes.map(n => {
    const days = n.creado_en_fecha ? daysBetween(n.creado_en_fecha, state.todayISO) : 0;
    const carryBadge = days >= 1
      ? `<span class="from-yesterday"><svg class="ic" style="font-size:11px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>${days === 1 ? 'viene de ayer' : days + ' días'}</span>`
      : '';
    let content;
    if (n.tipo === 'longform') {
      const titleHtml = n.titulo ? escapeHtml(n.titulo) : '<span class="note-longform-empty">Sin título</span>';
      const previewText = (n.cuerpo || '').replace(/\s+/g, ' ').trim();
      const previewHtml = previewText ? `<span class="note-longform-preview">${escapeHtml(previewText)}</span>` : '';
      content = `<div class="note-longform" data-longform-id="${escapeAttr(n.id)}"><span class="note-longform-icon">${longformIcon}</span><div class="note-longform-body"><span class="note-longform-title">${titleHtml}</span>${previewHtml}</div></div>`;
    } else {
      // Toda nota que no sea longform es checkable (incluye 'check' y legacy 'texto')
      content = `<div class="note-check ${n.completado ? 'done' : ''}"><input type="checkbox" ${n.completado ? 'checked' : ''} data-toggle-id="${escapeAttr(n.id)}"><span>${escapeHtml(n.texto)}${!n.completado ? carryBadge : ''}</span></div>`;
    }
    return `<div class="note-row"><div class="note-content">${content}</div><button class="note-delete" data-delete-id="${escapeAttr(n.id)}" aria-label="Borrar nota">${delIcon}</button></div>`;
  }).join('');
  el.querySelectorAll('[data-toggle-id]').forEach(input => {
    input.addEventListener('change', () => toggleNote(input.dataset.toggleId));
  });
  el.querySelectorAll('[data-delete-id]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); deleteNote(btn.dataset.deleteId); });
  });
  el.querySelectorAll('[data-longform-id]').forEach(row => {
    row.addEventListener('click', () => openLongformNoteModal(row.dataset.longformId));
  });
  // archive
  const archEl = document.getElementById('note-archive');
  const archList = document.getElementById('note-archive-list');
  if (state.notesArchive.length > 0) {
    archEl.style.display = 'block';
    archList.innerHTML = state.notesArchive.map(a => `
      <div class="archive-row">
        <span class="check-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        <span>${escapeHtml(a.texto)}<span class="time">— completada ${a.completado_at}</span></span>
      </div>
    `).join('');
  } else {
    archEl.style.display = 'none';
  }
}
function deleteNote(id) {
  state.notes = state.notes.filter(n => n.id !== id);
  renderNotes();
  saveNotesDebounced();
}
function toggleNote(id) {
  const n = state.notes.find(x => x.id === id);
  if (!n) return;
  n.completado = !n.completado;
  if (n.completado) {
    state.notes = state.notes.filter(x => x.id !== id);
    state.notesArchive.push({ id, texto: n.texto, completado_at: formatClock(new Date()) });
  }
  renderNotes();
  saveNotesDebounced();
}
function addNote(text) {
  // Default: check. Si quieres texto plano, usa prefijo "texto:"
  const isPlainText = /^texto:\s*/i.test(text.trim());
  const clean = text.replace(/^(texto:\s*|\+ ?check\s+|- \[ \] )/i, '').trim();
  if (!clean) return;
  const tipo = isPlainText ? 'texto' : 'check';
  const note = { id: uid(), tipo, texto: clean, completado: false, creado_en_fecha: state.todayISO };
  state.notes.push(note);
  renderNotes();
  saveNotesDebounced();
}
const saveNotesDebounced = debounce(async () => {
  await api.saveDailyNotes(state.todayISO, state.notes, state.notesArchive);
  document.getElementById('notes-autosave').innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Guardado · ${formatClock(new Date())}`;
}, 600);

   LONGFORM NOTE MODAL
   ═══════════════════════════════════════════════════════════════ */
function openLongformNoteModal(noteId) {
  const n = state.notes.find(x => x.id === noteId);
  if (!n) return;
  state.currentLongformId = noteId;
  document.getElementById('modal-longform-title').value = n.titulo || '';
  document.getElementById('modal-longform-body').value = n.cuerpo || '';
  document.getElementById('modal-longform-meta').textContent = `Nota del ${formatFullDate(new Date(n.creado_en_fecha + 'T00:00:00'))}`;
  document.getElementById('modal-longform-autosave').innerHTML = (n.titulo || n.cuerpo) ? `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Guardado` : 'Sin cambios';
  document.getElementById('longform-note-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    const titleEl = document.getElementById('modal-longform-title');
    if (!n.titulo) titleEl.focus();
    else document.getElementById('modal-longform-body').focus();
  }, 60);
}
function closeLongformNoteModal() {
  document.getElementById('longform-note-modal').classList.remove('open');
  document.body.style.overflow = '';
  state.currentLongformId = null;
  renderNotes();
}
const saveLongformDebounced = debounce(() => {
  if (!state.currentLongformId) return;
  const n = state.notes.find(x => x.id === state.currentLongformId);
  if (!n) return;
  n.titulo = document.getElementById('modal-longform-title').value;
  n.cuerpo = document.getElementById('modal-longform-body').value;
  document.getElementById('modal-longform-autosave').innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Guardado · ${formatClock(new Date())}`;
  saveNotesDebounced();
}, 400);
function createLongformNote() {
  const note = { id: uid(), tipo: 'longform', titulo: '', cuerpo: '', creado_en_fecha: state.todayISO };
  state.notes.push(note);
  renderNotes();
  openLongformNoteModal(note.id);
  saveNotesDebounced();
}
function deleteCurrentLongform() {
  if (!state.currentLongformId) return;
  if (!confirm('¿Borrar esta nota? Esta acción no se puede deshacer.')) return;
  const id = state.currentLongformId;
  closeLongformNoteModal();
  state.notes = state.notes.filter(n => n.id !== id);
  renderNotes();
  saveNotesDebounced();
}

async function renderPastNotes() {
  const search = document.getElementById('pn-search').value;
  const notes = await api.loadPastNotes(search);
  document.getElementById('pn-count').textContent = `${notes.length} nota${notes.length === 1 ? '' : 's'}`;
  const el = document.getElementById('pn-list');
  if (notes.length === 0) { el.innerHTML = '<p class="pn-empty">No hay notas que coincidan</p>'; return; }
  // group by month
  const groups = {};
  notes.forEach(n => {
    const d = new Date(n.date + 'T00:00:00');
    const key = `${MONTHS[d.getMonth()].charAt(0).toUpperCase() + MONTHS[d.getMonth()].slice(1)} ${d.getFullYear()}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(n);
  });
  state.pastNotesCache = notes;
  const delIcon = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M5 6l1 14h12l1-14"/></svg>`;
  el.innerHTML = Object.entries(groups).map(([month, items]) => `
    <p class="pn-group">${month}</p>
    ${items.map(n => `
      <div class="pn-row" data-event-id="${escapeAttr(n.event_id)}">
        <div class="pn-row-content">
          <p class="pn-row-title">${escapeHtml(n.title)}</p>
          <p class="pn-row-preview">${escapeHtml(n.preview)}</p>
        </div>
        <span class="pn-row-date">${formatShortDate(n.date)}</span>
        <button class="pn-row-delete" data-delete-event-id="${escapeAttr(n.event_id)}" aria-label="Borrar nota">${delIcon}</button>
      </div>
    `).join('')}
  `).join('');
  el.querySelectorAll('.pn-row').forEach(row => {
    row.addEventListener('click', () => {
      const n = state.pastNotesCache.find(x => x.event_id === row.dataset.eventId);
      if (n) openEventNoteModal(n.event_id, n.title, '—', '');
    });
  });
  el.querySelectorAll('[data-delete-event-id]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = btn.dataset.deleteEventId;
      const n = state.pastNotesCache.find(x => x.event_id === id);
      if (!confirm(`¿Borrar la nota de "${n?.title || 'esta reunión'}"?`)) return;
      await api.deleteEventNote(id);
      await renderPastNotes();
    });
  });
}

/* ═══════════════════════════════════════════════════════════════
   PAST DAILY NOTES VIEW
   ═══════════════════════════════════════════════════════════════ */
function formatDayLong(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${DAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
}
async function showPastDailyView() {
  closeEventNoteModal();
  document.getElementById('dashboard-view').classList.add('hidden');
  document.getElementById('past-notes-view').classList.add('hidden');
  document.getElementById('past-daily-view').classList.remove('hidden');
  window.scrollTo(0, 0);
  await renderPastDailyNotes();
}
function showDashboardFromPastDaily() {
  document.getElementById('past-daily-view').classList.add('hidden');
  document.getElementById('dashboard-view').classList.remove('hidden');
  window.scrollTo(0, 0);
}
async function renderPastDailyNotes() {
  const days = await api.loadPastDailyNotes();
  const todayStr = state.todayISO;
  const past = (days || []).filter(d => d.fecha < todayStr);
  document.getElementById('past-daily-count').textContent = `${past.length} día${past.length === 1 ? '' : 's'}`;
  const el = document.getElementById('past-daily-list');
  if (past.length === 0) {
    el.innerHTML = '<p class="pn-empty">Sin notas de días anteriores</p>';
    return;
  }
  const groups = {};
  past.forEach(d => {
    const date = new Date(d.fecha + 'T00:00:00');
    const key = `${MONTHS[date.getMonth()].charAt(0).toUpperCase() + MONTHS[date.getMonth()].slice(1)} ${date.getFullYear()}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  state.pastDailyCache = past;
  el.innerHTML = Object.entries(groups).map(([month, items]) => `
    <p class="pn-group">${month}</p>
    ${items.map(d => {
      const total = (d.items_count || 0) + (d.archive_count || 0);
      return `
      <div class="pn-row" data-fecha="${escapeAttr(d.fecha)}">
        <div class="pn-row-content">
          <p class="pn-row-title">${formatDayLong(d.fecha)}</p>
          <p class="pn-row-preview">${escapeHtml(d.preview)} · ${total} item${total === 1 ? '' : 's'}</p>
        </div>
        <span class="pn-row-date">${formatShortDate(d.fecha)}</span>
      </div>
    `;
    }).join('')}
  `).join('');
  el.querySelectorAll('.pn-row').forEach(row => {
    row.addEventListener('click', () => openPastDailyModal(row.dataset.fecha));
  });
}
async function openPastDailyModal(fecha) {
  const data = await api.loadDailyNotes(fecha);
  const items = Array.isArray(data?.items) ? data.items : [];
  const archive = Array.isArray(data?.archive) ? data.archive : [];
  document.getElementById('past-daily-modal-date').textContent = formatDayLong(fecha);
  document.getElementById('past-daily-modal-count').textContent = `${items.length} pendiente${items.length === 1 ? '' : 's'} · ${archive.length} completada${archive.length === 1 ? '' : 's'}`;
  const itemsEl = document.getElementById('past-daily-modal-items');
  let html = '';
  if (items.length === 0 && archive.length === 0) {
    html = '<p style="color: var(--muted2); font-size: 14px; padding: 8px 0;">Sin notas ese día.</p>';
  } else {
    items.forEach(n => {
      if (n.tipo === 'longform') {
        const titulo = n.titulo || '(sin título)';
        const cuerpo = n.cuerpo || '';
        html += `<div style="padding: 10px 12px; background: var(--surface-soft); border-radius: var(--radius-sm); margin-bottom: 8px;"><div style="font-weight: 500; margin-bottom: 4px;">${escapeHtml(titulo)}</div><div style="font-size: 13px; color: var(--muted); white-space: pre-wrap;">${escapeHtml(cuerpo)}</div></div>`;
      } else if (n.tipo === 'check') {
        html += `<div style="padding: 4px 0; display: flex; align-items: flex-start; gap: 8px; font-size: 14px;"><input type="checkbox" ${n.completado ? 'checked' : ''} disabled style="margin-top: 4px;"><span ${n.completado ? 'style="text-decoration: line-through; color: var(--muted2);"' : ''}>${escapeHtml(n.texto)}</span></div>`;
      } else {
        html += `<div style="padding: 4px 0; font-size: 14px;">${escapeHtml(n.texto)}</div>`;
      }
    });
    if (archive.length > 0) {
      html += `<div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);"><p class="section-mini">Completadas ese día</p>`;
      archive.forEach(a => {
        html += `<div style="padding: 3px 0; font-size: 13px; color: var(--muted);"><span style="color: var(--green); margin-right: 6px;">✓</span>${escapeHtml(a.texto)} <span style="font-size: 11px; color: var(--muted2); margin-left: 4px;">— ${escapeHtml(a.completado_at || '')}</span></div>`;
      });
      html += `</div>`;
    }
  }
  itemsEl.innerHTML = html;
  document.getElementById('past-daily-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePastDailyModal() {
  document.getElementById('past-daily-modal').classList.remove('open');
  document.body.style.overflow = '';
}

/* ═══════════════════════════════════════════════════════════════
   ESCAPE HTML
   ═══════════════════════════════════════════════════════════════ */
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
async function init() {
  renderHero();
  setInterval(renderHero, 60000);
  await Promise.all([renderAgenda(), renderTodos(), renderHealth(), loadNotes()]);

  // listeners
  document.getElementById('btn-add-event').addEventListener('click', openAddEventModal);
  document.getElementById('btn-expand-todos').addEventListener('click', expandTodos);
  document.getElementById('btn-refresh-whoop').addEventListener('click', refreshWhoop);
  document.getElementById('btn-refresh-garmin').addEventListener('click', refreshGarmin);
  document.getElementById('open-past-notes').addEventListener('click', showPastNotesView);
  document.getElementById('back-to-dashboard').addEventListener('click', showDashboardView);
  document.getElementById('pn-search').addEventListener('input', debounce(renderPastNotes, 200));
  document.getElementById('modal-prep').addEventListener('input', saveEventNoteDebounced);
  document.getElementById('modal-during').addEventListener('input', saveEventNoteDebounced);
  const noteInput = document.getElementById('note-add-input');
  const addCurrentNote = () => {
    const val = noteInput.value;
    if (val.trim()) {
      addNote(val);
      noteInput.value = '';
      noteInput.focus();
    }
  };
  noteInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCurrentNote(); } });
  document.getElementById('btn-add-note').addEventListener('click', addCurrentNote);
  document.getElementById('btn-add-longform').addEventListener('click', createLongformNote);
  document.getElementById('modal-longform-title').addEventListener('input', saveLongformDebounced);
  document.getElementById('modal-longform-body').addEventListener('input', saveLongformDebounced);
  document.getElementById('btn-delete-longform').addEventListener('click', deleteCurrentLongform);

  // Atajos: notas pasadas desde el panel agenda y notas anteriores desde panel daily
  document.getElementById('agenda-past-notes').addEventListener('click', showPastNotesView);
  document.getElementById('btn-past-daily-notes').addEventListener('click', showPastDailyView);
  document.getElementById('back-from-past-daily').addEventListener('click', showDashboardFromPastDaily);

  // ESC closes modals
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('event-note-modal').classList.contains('open')) closeEventNoteModal();
      if (document.getElementById('add-event-modal').classList.contains('open')) closeAddEventModal();
      if (document.getElementById('longform-note-modal').classList.contains('open')) closeLongformNoteModal();
      if (document.getElementById('past-daily-modal').classList.contains('open')) closePastDailyModal();
    }
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
