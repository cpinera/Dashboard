<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fa">
<title>Tobin · Dashboard</title>
<style>
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --border: #e5e9f0;
  --border-strong: #d1d8e3;
  --text: #1a2030;
  --muted: #5e6b85;
  --muted2: #94a0b8;
  --blue: #2563eb;
  --blue-soft: #eff4ff;
  --blue-dark: #1e40af;
  --green: #16a34a;
  --green-soft: #ecfdf5;
  --green-dark: #15803d;
  --amber: #c2680c;
  --amber-soft: #fef6e7;
  --amber-dark: #92400e;
  --red: #c63232;
  --red-soft: #fef1f1;
  --red-dark: #9b1c1c;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(15, 25, 50, 0.04);
  --shadow-md: 0 4px 16px rgba(15, 25, 50, 0.08);
  --shadow-lg: 0 12px 40px rgba(15, 25, 50, 0.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: inherit; text-decoration: none; }

.view { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
.view.hidden { display: none; }

/* ── Hero ─────────────────────────────────────────────── */
.hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.hero-greet { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
.hero-date { font-size: 16px; color: var(--muted); text-transform: capitalize; }
.hero-meta { font-size: 13px; color: var(--muted2); display: inline-flex; align-items: center; gap: 6px; }
.hero-actions { display: flex; gap: 8px; align-items: center; }
.linkbtn { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: var(--radius-sm); transition: background 0.15s; }
.linkbtn:hover { background: rgba(15, 25, 50, 0.05); color: var(--text); }

/* ── Layout ───────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
.card-h {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  display: inline-flex; align-items: center; gap: 8px;
}
.card-h-icon { font-size: 14px; color: var(--muted2); }

/* ── Buttons ──────────────────────────────────────────── */
.btn-soft {
  font-size: 12.5px;
  padding: 6px 11px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.btn-soft:hover { background: var(--surface-soft); color: var(--text); }
.btn-primary {
  font-size: 13px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  background: var(--blue);
  color: white;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.9; }
.btn-ghost-row {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 0;
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px dashed var(--border-strong);
  transition: color 0.15s;
}
.btn-ghost-row:hover { color: var(--blue); }
.btn-expand {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 0;
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  transition: color 0.15s;
}
.btn-expand:hover { color: var(--blue); }

/* ── Agenda ───────────────────────────────────────────── */
.evt { padding: 12px 0; border-top: 1px solid var(--border); }
.evt:first-of-type { border-top: none; padding-top: 0; }
.evt-main { display: flex; align-items: center; gap: 14px; font-size: 15px; }
.evt-time { font-size: 13px; color: var(--muted2); min-width: 48px; font-variant-numeric: tabular-nums; }
.evt-title { flex: 1; }
.evt-note-btn {
  color: var(--muted2);
  font-size: 17px;
  padding: 4px 6px;
  border-radius: 4px;
  transition: all 0.15s;
}
.evt-note-btn:hover { color: var(--blue); background: var(--blue-soft); }
.evt-note-btn.has { color: var(--blue); }

/* ── Daily notes ──────────────────────────────────────── */
.section-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted2);
  margin: 6px 0 4px;
}
.notes-area {
  background: var(--surface-soft);
  border-radius: var(--radius);
  padding: 16px;
  min-height: 140px;
}
.note-line { padding: 4px 0; font-size: 15px; }
.note-check { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; font-size: 15px; }
.note-check input { margin-top: 5px; flex-shrink: 0; width: 17px; height: 17px; accent-color: var(--blue); cursor: pointer; }
.note-check.done span:last-child { text-decoration: line-through; color: var(--muted2); }
.from-yesterday {
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--amber-soft);
  color: var(--amber-dark);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 8px;
  vertical-align: 2px;
}
.note-add-row { display: flex; gap: 8px; margin-top: 10px; }
.note-add-input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 14px;
  background: white;
  outline: none;
  transition: border-color 0.15s;
}
.note-add-input:focus { border-color: var(--blue); }
.note-row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
.note-row > .note-content { flex: 1; min-width: 0; }
.note-delete {
  opacity: 0;
  padding: 4px 6px;
  font-size: 13px;
  color: var(--muted2);
  border-radius: 4px;
  transition: opacity 0.15s, color 0.15s, background 0.15s;
  flex-shrink: 0;
  line-height: 1;
}
.note-delete { opacity: 0.4; }
.note-row:hover .note-delete { opacity: 0.7; }
.note-row .note-delete:hover { opacity: 1; color: var(--red); background: var(--red-soft); }
.note-text-editable { cursor: text; padding: 2px 4px; border-radius: 3px; transition: background 0.15s; }
.note-text-editable:hover { background: var(--blue-soft); }
.note-longform {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  min-width: 0;
  overflow: hidden;
}
.note-longform:hover { border-color: var(--blue); background: var(--blue-soft); }
.note-longform-icon { color: var(--muted); font-size: 15px; flex-shrink: 0; }
.note-longform-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.note-longform-title { font-weight: 500; font-size: 14.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.note-longform-empty { color: var(--muted2); font-weight: 400; font-style: italic; }
.note-longform-preview { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.modal-title-input {
  font-size: 18px;
  font-weight: 600;
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  padding: 0;
  margin-bottom: 5px;
  color: var(--text);
  font-family: inherit;
  letter-spacing: -0.01em;
}
.modal-title-input::placeholder { color: var(--muted2); font-weight: 400; }
.note-archive { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.archive-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13.5px; color: var(--muted); }
.archive-row .check-icon { color: var(--green); font-size: 14px; }
.archive-row .time { font-size: 11.5px; color: var(--muted2); margin-left: 4px; }
.autosave { font-size: 12px; color: var(--muted2); display: inline-flex; align-items: center; gap: 4px; }

/* ── Modal ────────────────────────────────────────────── */
.modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 60px 20px; overflow-y: auto; }
.modal.open { display: flex; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(15, 25, 50, 0.42); backdrop-filter: blur(2px); }
.modal-card {
  position: relative;
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 560px;
  padding: 22px 26px 18px;
  box-shadow: var(--shadow-lg);
  z-index: 1;
}
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.modal-title { font-size: 18px; font-weight: 600; line-height: 1.3; margin-bottom: 5px; }
.modal-meta { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.modal-close { font-size: 20px; color: var(--muted2); padding: 4px; line-height: 1; transition: color 0.15s; }
.modal-close:hover { color: var(--text); }
.modal-body { border-top: 1px solid var(--border); padding-top: 14px; min-height: 260px; }
.section-mini {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted2);
  margin: 0 0 6px;
}
.modal-textarea {
  width: 100%;
  min-height: 90px;
  border: none;
  outline: none;
  resize: vertical;
  font-size: 14.5px;
  line-height: 1.65;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  margin-bottom: 14px;
}
.modal-textarea::placeholder { color: var(--muted2); font-style: italic; }
.modal-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12.5px; flex-wrap: wrap; }

/* ── Add event modal ──────────────────────────────────── */
.field { display: block; margin-bottom: 14px; }
.field-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; display: block; font-weight: 500; }
.field-input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  background: white;
  outline: none;
  transition: border-color 0.15s;
}
.field-input:focus { border-color: var(--blue); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Past notes view ──────────────────────────────────── */
.back-btn {
  font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 10px; border-radius: var(--radius-sm); margin-bottom: 16px;
  transition: all 0.15s;
}
.back-btn:hover { background: var(--surface-soft); color: var(--text); }
.pn-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
.pn-title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 10px; }
.pn-count { font-size: 13px; color: var(--muted2); }
.search-wrap { position: relative; margin-bottom: 24px; }
.search-input {
  width: 100%;
  padding: 11px 14px 11px 40px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14.5px;
  background: var(--surface);
  outline: none;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--blue); }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted2); font-size: 16px; pointer-events: none; }
.pn-group {
  font-size: 11px; font-weight: 600;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 18px 0 8px;
}
.pn-group:first-of-type { margin-top: 0; }
.pn-row {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  padding: 14px 4px;
  border-top: 1px solid var(--border);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background 0.15s;
}
.pn-row:hover { background: var(--surface-soft); }
.pn-row-content { min-width: 0; flex: 1; }
.pn-row-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.pn-row-preview { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.pn-row-date { font-size: 12.5px; color: var(--muted2); white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 2px; }
.pn-empty { padding: 40px 0; text-align: center; color: var(--muted2); font-size: 14px; }
.pn-row-delete {
  opacity: 0;
  padding: 4px 8px;
  font-size: 14px;
  color: var(--muted2);
  border-radius: 4px;
  transition: opacity 0.15s, color 0.15s, background 0.15s;
  background: transparent;
  border: none;
  cursor: pointer;
  align-self: center;
}
.pn-row:hover .pn-row-delete { opacity: 0.55; }
.pn-row-delete:hover { opacity: 1 !important; color: var(--red); background: var(--red-soft); }
@media (hover: none) { .pn-row-delete { opacity: 0.4; } }

/* Panel header link (pequeño) */
.panel-link {
  font-size: 11.5px;
  color: var(--muted);
  cursor: pointer;
  background: none;
  border: none;
  padding: 5px 9px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: color 0.15s, background 0.15s;
  font-family: inherit;
}
.panel-link:hover { color: var(--blue); background: var(--blue-soft); }
.panel-actions { display: inline-flex; gap: 4px; align-items: center; }

/* Botón "+" del input de notas */
.btn-add-note {
  background: var(--blue);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  width: 36px;
  height: 36px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
  flex-shrink: 0;
  font-size: 18px;
  line-height: 1;
}
.btn-add-note:hover { opacity: 0.9; }

/* ── Tabs ─────────────────────────────────────────────── */
.tabs { display: flex; gap: 4px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
.tab {
  font-size: 14.5px; font-weight: 500; color: var(--muted);
  padding: 10px 16px; border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: color 0.15s, border-color 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-panel.hidden { display: none; }

/* ── Month nav ────────────────────────────────────────── */
.month-nav { display: inline-flex; align-items: center; gap: 2px; }
.month-btn { color: var(--muted); padding: 4px 6px; border-radius: var(--radius-sm); transition: background 0.15s, color 0.15s; }
.month-btn:hover { background: var(--surface-soft); color: var(--text); }
.month-label { font-size: 13px; color: var(--muted); min-width: 104px; text-align: center; text-transform: capitalize; font-variant-numeric: tabular-nums; }

/* ── Cuentas ──────────────────────────────────────────── */
.cuenta-row { display: flex; align-items: center; gap: 10px; }
.cuenta-check { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; padding: 10px 4px; border-top: 1px solid var(--border); }
.cuenta-row:first-child .cuenta-check { border-top: none; }
.cuenta-check > input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--blue); cursor: pointer; }
.cuenta-nombre { flex: 1; min-width: 0; cursor: text; padding: 2px 4px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background 0.15s; }
.cuenta-nombre:hover { background: var(--blue-soft); }
.cuenta-monto { font-size: 14.5px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); cursor: text; padding: 2px 6px; border-radius: 3px; white-space: nowrap; transition: background 0.15s; }
.cuenta-monto:hover { background: var(--blue-soft); }
.cuenta-row.done .cuenta-nombre, .cuenta-row.done .cuenta-monto { text-decoration: line-through; color: var(--muted2); font-weight: 400; }
.cuenta-delete { opacity: 0.4; padding: 4px 6px; font-size: 13px; color: var(--muted2); border-radius: 4px; line-height: 1; flex-shrink: 0; transition: opacity 0.15s, color 0.15s, background 0.15s; }
.cuenta-row:hover .cuenta-delete { opacity: 0.7; }
.cuenta-delete:hover { opacity: 1; color: var(--red); background: var(--red-soft); }
.cuenta-edit-input { border: 1px solid var(--blue); border-radius: 4px; padding: 3px 8px; font-size: 14px; font-family: inherit; outline: none; background: white; }
.cuenta-add-row { display: flex; gap: 8px; margin-top: 12px; }
.cuenta-add-nombre { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 14px; background: white; outline: none; transition: border-color 0.15s; }
.cuenta-add-monto { width: 108px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 14px; background: white; outline: none; text-align: right; font-variant-numeric: tabular-nums; transition: border-color 0.15s; }
.cuenta-add-nombre:focus, .cuenta-add-monto:focus { border-color: var(--blue); }
.cuenta-summary { display: flex; gap: 24px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.cs-item { display: flex; flex-direction: column; gap: 3px; }
.cs-label { font-size: 10.5px; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.cs-val { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.cs-val.pend { color: var(--amber-dark); }
.cs-val.paid { color: var(--green-dark); }
.cuenta-empty { color: var(--muted2); font-size: 14px; padding: 14px 4px; }

/* ── Icons (inline SVG names) ─────────────────────────── */
.ic { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; }
</style>
</head>
<body>

<main id="dashboard-view" class="view">

  <div class="hero">
    <div>
      <h1 class="hero-greet" id="hero-greet">Buenos días, Cristobal</h1>
      <p class="hero-date" id="hero-date">—</p>
    </div>
    <div class="hero-actions">
      <button class="linkbtn" id="open-past-notes">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span>Notas pasadas</span>
      </button>
      <span class="hero-meta">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="hero-clock">—</span>
      </span>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="hoy">Hoy</button>
    <button class="tab" data-tab="cuentas">Cuentas</button>
  </nav>

  <div id="tab-hoy" class="tab-panel">

  <section class="card" id="agenda-card">
      <div class="card-head">
        <span class="card-h">
          <svg class="ic card-h-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Agenda de hoy
        </span>
        <div class="panel-actions">
          <button class="panel-link" id="agenda-past-notes" title="Ver notas de reuniones pasadas">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            <span>Notas pasadas</span>
          </button>
          <button class="btn-soft" id="btn-add-event">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Agregar
          </button>
        </div>
      </div>

<script>
/* ═══════════════════════════════════════════════════════════════

const CONFIG = {

/* ═══════════════════════════════════════════════════════════════

  ],
  eventNotes: {
    ev2: { prep: '· Revisar último deck que mandaron en abril\n· Pregunta clave: cuánto runway tienen\n· Confirmar si Felipe se suma al call', durante: '' },

  pastNotes: [
    { event_id: 'p1', title: 'Revisión semanal pipeline', date: '2026-05-15', preview: 'Cerrar lista de empresas Q3 · decidir qué memos priorizar · siguiente: hablar con Vale', prep: '', durante: '' },
    { event_id: 'p2', title: 'Call con Tropic Ventures', date: '2026-05-14', preview: 'Co-invest oportunidad ronda seed de Beta · pidieron 200k · pending check size definitivo', prep: '', durante: '' },

/* ═══════════════════════════════════════════════════════════════
   DATA LAYER — funciones que envuelven mock o fetch real
   ═══════════════════════════════════════════════════════════════ */
const api = {
  async loadCalendar() {
    if (CONFIG.useMockData) return MOCK_DATA.calendar;
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/calendar/today`, { headers: authHeaders() });
    return r.json();
  },
  async createEvent(payload) {
    if (CONFIG.useMockData) { MOCK_DATA.calendar.push({ ...payload, id: 'mock' + Date.now(), hasNote: false }); return; }
    await fetch(`${CONFIG.botApiBase}/dashboard/calendar/event`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  },
  async loadCuentas(mes) {
    if (CONFIG.useMockData) {
      return (MOCK_DATA.cuentas || []).map(c => ({ ...c, pagado: !!MOCK_DATA.cuentasChecks[`${c.id}:${mes}`] }));
    }
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/cuentas/${mes}`, { headers: authHeaders() });
    return r.json();
  },
  async createCuenta(payload) {
    if (CONFIG.useMockData) { const item = { id: uid(), pagado: false, orden: 0, ...payload }; MOCK_DATA.cuentas.push(item); return { ok: true, item }; }
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/cuentas`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    return r.json();
  },
  async updateCuenta(id, fields) {
    if (CONFIG.useMockData) { const c = MOCK_DATA.cuentas.find(x => String(x.id) === String(id)); if (c) Object.assign(c, fields); return { ok: true }; }
    await fetch(`${CONFIG.botApiBase}/dashboard/cuentas/${id}`, { method: 'PATCH', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(fields) });
  },
  async deleteCuenta(id) {
    if (CONFIG.useMockData) { MOCK_DATA.cuentas = MOCK_DATA.cuentas.filter(x => String(x.id) !== String(id)); return; }
    await fetch(`${CONFIG.botApiBase}/dashboard/cuentas/${id}`, { method: 'DELETE', headers: authHeaders() });
  },
  async setCuentaCheck(id, mes, pagado) {
    if (CONFIG.useMockData) { MOCK_DATA.cuentasChecks[`${id}:${mes}`] = pagado; return; }
    await fetch(`${CONFIG.botApiBase}/dashboard/cuentas/${id}/check/${mes}`, { method: 'PUT', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ pagado }) });
  },
  async loadActiveNotes() {
    if (CONFIG.useMockData) return MOCK_DATA.dailyNotes || [];
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/note-items/active`, { headers: authHeaders() });
    return r.json();
  },
  async createNote(payload) {
    if (CONFIG.useMockData) {
      const note = { id: uid(), creado_at: new Date().toISOString(), completado: false, deleted: false, tipo: 'check', texto: '', titulo: '', cuerpo: '', ...payload };
      MOCK_DATA.dailyNotes.push(note);
      return { ok: true, item: note };
    }
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/note-items`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    return r.json();
  },
  async updateNote(id, fields) {
    if (CONFIG.useMockData) {
      const n = MOCK_DATA.dailyNotes.find(x => x.id === id);
      if (n) Object.assign(n, fields, fields.completado !== undefined ? { completado_at: fields.completado ? new Date().toISOString() : null } : {});
      return { ok: true };
    }
    await fetch(`${CONFIG.botApiBase}/dashboard/note-items/${id}`, { method: 'PATCH', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(fields) });
  },
  async deleteNoteApi(id) {
    if (CONFIG.useMockData) { MOCK_DATA.dailyNotes = MOCK_DATA.dailyNotes.filter(x => x.id !== id); return; }
    await fetch(`${CONFIG.botApiBase}/dashboard/note-items/${id}`, { method: 'DELETE', headers: authHeaders() });
  },
  async loadNotesHistory() {
    if (CONFIG.useMockData) return MOCK_DATA.dailyNotes || [];
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/note-items/history`, { headers: authHeaders() });
    return r.json();
  },
  async loadEventNote(eventId) {
    if (CONFIG.useMockData) return MOCK_DATA.eventNotes[eventId] || { prep: '', durante: '' };
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/event-notes/${eventId}`, { headers: authHeaders() });
    return r.json();
  },
  async saveEventNote(eventId, prep, durante, eventTitle, eventStart) {
    if (CONFIG.useMockData) { MOCK_DATA.eventNotes[eventId] = { prep, durante }; return; }
    await fetch(`${CONFIG.botApiBase}/dashboard/event-notes/${eventId}`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ prep, durante, event_title: eventTitle, event_start: eventStart }) });
  },
  async loadPastNotes(search = '') {
    if (CONFIG.useMockData) {
      const s = search.toLowerCase();
      return MOCK_DATA.pastNotes.filter(n =>
        !s || n.title.toLowerCase().includes(s) || n.preview.toLowerCase().includes(s) || n.date.includes(s)
      );
    }
    const r = await fetch(`${CONFIG.botApiBase}/dashboard/event-notes?search=${encodeURIComponent(search)}`, { headers: authHeaders() });
    return r.json();
  },
  async deleteEventNote(eventId) {
    if (CONFIG.useMockData) {
      MOCK_DATA.pastNotes = MOCK_DATA.pastNotes.filter(n => n.event_id !== eventId);
      delete MOCK_DATA.eventNotes[eventId];
      return;
    }
    await fetch(`${CONFIG.botApiBase}/dashboard/event-notes/${encodeURIComponent(eventId)}`, {
      method: 'DELETE',
      headers: authHeaders(),
    });
  },
  async loadPastDailyNotes() {
    if (CONFIG.useMockData) {
      return [

function authHeaders() { return CONFIG.apiKey ? { 'x-api-key': CONFIG.apiKey } : {}; }

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */
const DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const SHORT_DAYS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const SHORT_MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function formatFullDate(d) { return `${DAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]} de ${d.getFullYear()}`; }
function formatShortDate(iso) { const d = new Date(iso + 'T00:00:00'); const today = new Date(); const sameMonth = d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear(); return sameMonth ? `${SHORT_DAYS[d.getDay()]} ${d.getDate()}` : `${d.getDate()} ${SHORT_MONTHS[d.getMonth()]}`; }
function formatClock(d) { return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function daysBetween(isoOld, isoNew) { const a = new Date(isoOld + 'T00:00:00'); const b = new Date(isoNew + 'T00:00:00'); return Math.round((b - a) / (1000 * 60 * 60 * 24)); }
function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }
function uid() { return 'i' + Math.random().toString(36).slice(2, 9); }

async function loadNotes() {
  try {
    const items = await api.loadActiveNotes();
    state.notes = Array.isArray(items) ? items : [];
  } catch (e) {
    console.error('loadNotes error:', e);
    state.notes = [];
  }
  state.notesArchive = []; // legacy, ya no se usa
  renderNotes();
}
function renderNotes() {
  const el = document.getElementById('notes-list');
  const delIcon = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
  const longformIcon = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H10M16 17H10"/></svg>`;
  el.innerHTML = state.notes.map(n => {
    const creadoFecha = (n.creado_at || '').slice(0, 10);
    const days = creadoFecha ? daysBetween(creadoFecha, state.todayISO) : 0;
    const carryBadge = (days >= 1 && !n.completado)
      ? `<span class="from-yesterday"><svg class="ic" style="font-size:11px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>${days === 1 ? 'viene de ayer' : days + ' días'}</span>`
      : '';
    let content;
    if (n.tipo === 'longform') {
      const titleHtml = n.titulo ? escapeHtml(n.titulo) : '<span class="note-longform-empty">Sin título</span>';
      const previewText = (n.cuerpo || '').replace(/\s+/g, ' ').trim();
      const previewHtml = previewText ? `<span class="note-longform-preview">${escapeHtml(previewText)}</span>` : '';
      content = `<div class="note-longform" data-longform-id="${escapeAttr(n.id)}"><span class="note-longform-icon">${longformIcon}</span><div class="note-longform-body"><span class="note-longform-title">${titleHtml}</span>${previewHtml}</div></div>`;
    } else {
      // Check + editable text on click
      content = `<div class="note-check ${n.completado ? 'done' : ''}"><input type="checkbox" ${n.completado ? 'checked' : ''} data-toggle-id="${escapeAttr(n.id)}"><span class="note-text-editable" data-edit-id="${escapeAttr(n.id)}" title="Click para editar">${escapeHtml(n.texto)}${!n.completado ? carryBadge : ''}</span></div>`;
    }
    return `<div class="note-row"><div class="note-content">${content}</div><button class="note-delete" data-delete-id="${escapeAttr(n.id)}" aria-label="Borrar nota">${delIcon}</button></div>`;
  }).join('');
  el.querySelectorAll('[data-toggle-id]').forEach(input => {
    input.addEventListener('change', () => toggleNote(input.dataset.toggleId));
  });
  el.querySelectorAll('[data-delete-id]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); deleteNote(btn.dataset.deleteId); });
  });
  el.querySelectorAll('[data-longform-id]').forEach(row => {
    row.addEventListener('click', () => openLongformNoteModal(row.dataset.longformId));
  });
  el.querySelectorAll('[data-edit-id]').forEach(span => {
    span.addEventListener('click', e => { e.stopPropagation(); startEditNote(span.dataset.editId, span); });
  });
  document.getElementById('note-archive').style.display = 'none';
}
function startEditNote(id, spanEl) {
  const n = state.notes.find(x => x.id === id);
  if (!n) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = n.texto || '';
  input.className = 'note-edit-input';
  input.style.cssText = 'flex:1; border:1px solid var(--blue); border-radius:4px; padding:4px 8px; font-size:14px; font-family:inherit; outline:none; background:white;';
  spanEl.replaceWith(input);
  input.focus();
  input.select();
  const save = async () => {
    const newText = input.value.trim();
    if (newText && newText !== n.texto) {
      n.texto = newText;
      await api.updateNote(id, { texto: newText });
    }
    renderNotes();
  };
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { renderNotes(); }
  });
}
async function deleteNote(id) {
  state.notes = state.notes.filter(n => n.id !== id);
  renderNotes();
  await api.deleteNoteApi(id);
}
async function toggleNote(id) {
  const n = state.notes.find(x => x.id === id);
  if (!n) return;
  n.completado = !n.completado;
  n.completado_at = n.completado ? new Date().toISOString() : null;
  renderNotes();
  await api.updateNote(id, { completado: n.completado });
  flashSaved();
}
async function addNote(text) {
  const clean = text.replace(/^(texto:\s*|\+ ?check\s+|- \[ \] )/i, '').trim();
  if (!clean) return;
  const tipo = 'check';
  const r = await api.createNote({ tipo, texto: clean });
  const item = r?.item || { id: uid(), tipo, texto: clean, completado: false, creado_at: new Date().toISOString() };
  state.notes.push(item);
  renderNotes();
  flashSaved();
}
function flashSaved() {
  document.getElementById('notes-autosave').innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Guardado · ${formatClock(new Date())}`;
}

function formatDayLong(iso) {
  const d = new Date(iso + 'T00:00:00');

async function renderPastDailyNotes() {
  const allItems = await api.loadNotesHistory();
  const todayStr = state.todayISO;
  // Agrupar por fecha de creación, excluir las creadas hoy (esas están en el panel principal)
  const byDate = {};
  (allItems || []).forEach(n => {
    const fecha = (n.creado_at || '').slice(0, 10);
    if (!fecha || fecha === todayStr) return;
    if (!byDate[fecha]) byDate[fecha] = [];
    byDate[fecha].push(n);
  });
  const fechas = Object.keys(byDate).sort().reverse();
  document.getElementById('past-daily-count').textContent = `${fechas.length} día${fechas.length === 1 ? '' : 's'}`;
  const el = document.getElementById('past-daily-list');
  if (fechas.length === 0) {
    el.innerHTML = '<p class="pn-empty">Sin notas de días anteriores</p>';
    return;
  }
  // Agrupar las fechas por mes
  const groups = {};
  fechas.forEach(f => {
    const d = new Date(f + 'T00:00:00');
    const key = `${MONTHS[d.getMonth()].charAt(0).toUpperCase() + MONTHS[d.getMonth()].slice(1)} ${d.getFullYear()}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(f);
  });
  state.pastDailyCache = byDate;
  el.innerHTML = Object.entries(groups).map(([month, dates]) => `
    <p class="pn-group">${month}</p>
    ${dates.map(f => {
      const items = byDate[f];
      const completadas = items.filter(x => x.completado).length;
      const pendientes = items.length - completadas;
      const firstItem = items[0];
      const preview = firstItem.tipo === 'longform' ? (firstItem.titulo || '(sin título)') : (firstItem.texto || '');
      return `
      <div class="pn-row" data-fecha="${escapeAttr(f)}">
        <div class="pn-row-content">
          <p class="pn-row-title">${formatDayLong(f)}</p>
          <p class="pn-row-preview">${escapeHtml(preview)} · ${pendientes} pendiente${pendientes === 1 ? '' : 's'}${completadas > 0 ? `, ${completadas} completada${completadas === 1 ? '' : 's'}` : ''}</p>
        </div>
        <span class="pn-row-date">${formatShortDate(f)}</span>
      </div>
    `;
    }).join('')}
  `).join('');
  el.querySelectorAll('.pn-row').forEach(row => {
    row.addEventListener('click', () => openPastDailyModal(row.dataset.fecha));
  });
}
function openPastDailyModal(fecha) {
  const items = state.pastDailyCache?.[fecha] || [];
  const pendientes = items.filter(n => !n.completado);
  const completadas = items.filter(n => n.completado);
  document.getElementById('past-daily-modal-date').textContent = formatDayLong(fecha);
  document.getElementById('past-daily-modal-count').textContent = `${pendientes.length} pendiente${pendientes.length === 1 ? '' : 's'} · ${completadas.length} completada${completadas.length === 1 ? '' : 's'}`;
  const itemsEl = document.getElementById('past-daily-modal-items');
  let html = '';
  if (items.length === 0) {
    html = '<p style="color: var(--muted2); font-size: 14px; padding: 8px 0;">Sin notas ese día.</p>';
  } else {
    items.forEach(n => {
      if (n.tipo === 'longform') {
        const titulo = n.titulo || '(sin título)';
        const cuerpo = n.cuerpo || '';
        html += `<div style="padding: 10px 12px; background: var(--surface-soft); border-radius: var(--radius-sm); margin-bottom: 8px;"><div style="font-weight: 500; margin-bottom: 4px;">${escapeHtml(titulo)}</div><div style="font-size: 13px; color: var(--muted); white-space: pre-wrap;">${escapeHtml(cuerpo)}</div></div>`;
      } else {
        const style = n.completado ? 'style="text-decoration: line-through; color: var(--muted2);"' : '';
        html += `<div style="padding: 4px 0; display: flex; align-items: flex-start; gap: 8px; font-size: 14px;"><input type="checkbox" ${n.completado ? 'checked' : ''} disabled style="margin-top: 4px;"><span ${style}>${escapeHtml(n.texto)}</span></div>`;
      }
    });
  }
  itemsEl.innerHTML = html;
  document.getElementById('past-daily-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePastDailyModal() {
  document.getElementById('past-daily-modal').classList.remove('open');
  document.body.style.overflow = '';
}

/* ═══════════════════════════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════════════════════════ */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('tab-hoy').classList.toggle('hidden', tab !== 'hoy');
  document.getElementById('tab-cuentas').classList.toggle('hidden', tab !== 'cuentas');
  if (tab === 'cuentas' && !state.cuentasLoaded) {
    state.cuentasLoaded = true;
    loadCuentas();
  }
}

/* ═══════════════════════════════════════════════════════════════
   CUENTAS
   ═══════════════════════════════════════════════════════════════ */
function formatMoney(n) { return '$' + (Math.round(Number(n) || 0)).toLocaleString('es-CL'); }
function parseMoney(s) { const d = String(s).replace(/[^\d]/g, ''); return d ? parseInt(d, 10) : 0; }
function monthLabel(mesKey) { const [y, m] = mesKey.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; }
function shiftMonth(mesKey, delta) {
  let [y, m] = mesKey.split('-').map(Number);
  m += delta;
  while (m < 1) { m += 12; y--; }
  while (m > 12) { m -= 12; y++; }
  return `${y}-${String(m).padStart(2, '0')}`;
}

async function loadCuentas() {
  try {
    const items = await api.loadCuentas(state.cuentasMes);
    state.cuentas = Array.isArray(items) ? items : [];
  } catch (e) {
    console.error('loadCuentas error:', e);
    state.cuentas = [];
  }
  renderCuentas();
}
function renderCuentas() {
  document.getElementById('cuentas-mes-label').textContent = monthLabel(state.cuentasMes);
  const el = document.getElementById('cuentas-list');
  const delIcon = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
  if (!state.cuentas.length) {
    el.innerHTML = '<p class="cuenta-empty">Sin gastos este mes. Agrega el primero abajo.</p>';
  } else {
    el.innerHTML = state.cuentas.map(c => `
      <div class="cuenta-row ${c.pagado ? 'done' : ''}" data-id="${escapeAttr(c.id)}">
        <div class="cuenta-check">
          <input type="checkbox" ${c.pagado ? 'checked' : ''} data-check-id="${escapeAttr(c.id)}" aria-label="Pagado">
          <span class="cuenta-nombre" data-name-id="${escapeAttr(c.id)}" title="Click para editar">${escapeHtml(c.nombre)}</span>
        </div>
        <span class="cuenta-monto" data-monto-id="${escapeAttr(c.id)}" title="Click para editar">${formatMoney(c.monto)}</span>
        <button class="cuenta-delete" data-del-id="${escapeAttr(c.id)}" aria-label="Eliminar">${delIcon}</button>
      </div>
    `).join('');
    el.querySelectorAll('[data-check-id]').forEach(i => i.addEventListener('change', () => toggleCuenta(i.dataset.checkId, i.checked)));
    el.querySelectorAll('[data-name-id]').forEach(s => s.addEventListener('click', () => editCuentaField(s.dataset.nameId, 'nombre', s)));
    el.querySelectorAll('[data-monto-id]').forEach(s => s.addEventListener('click', () => editCuentaField(s.dataset.montoId, 'monto', s)));
    el.querySelectorAll('[data-del-id]').forEach(b => b.addEventListener('click', () => deleteCuenta(b.dataset.delId)));
  }
  renderCuentaSummary();
}
function renderCuentaSummary() {
  const el = document.getElementById('cuenta-summary');
  if (!state.cuentas.length) { el.innerHTML = ''; return; }
  const total = state.cuentas.reduce((s, c) => s + (Number(c.monto) || 0), 0);
  const paid = state.cuentas.filter(c => c.pagado).reduce((s, c) => s + (Number(c.monto) || 0), 0);
  el.innerHTML = `
    <div class="cs-item"><span class="cs-label">Total</span><span class="cs-val">${formatMoney(total)}</span></div>
    <div class="cs-item"><span class="cs-label">Pagado</span><span class="cs-val paid">${formatMoney(paid)}</span></div>
    <div class="cs-item"><span class="cs-label">Pendiente</span><span class="cs-val pend">${formatMoney(total - paid)}</span></div>
  `;
}
async function toggleCuenta(id, checked) {
  const c = state.cuentas.find(x => String(x.id) === String(id));
  if (!c) return;
  c.pagado = checked;
  renderCuentas();
  await api.setCuentaCheck(id, state.cuentasMes, checked);
}
function editCuentaField(id, field, spanEl) {
  const c = state.cuentas.find(x => String(x.id) === String(id));
  if (!c) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'cuenta-edit-input';
  if (field === 'monto') {
    input.value = c.monto ? String(c.monto) : '';
    input.inputMode = 'numeric';
    input.style.cssText = 'width:108px; text-align:right;';
  } else {
    input.value = c.nombre || '';
    input.style.cssText = 'flex:1; min-width:0;';
  }
  spanEl.replaceWith(input);
  input.focus();
  input.select();
  const save = async () => {
    if (field === 'monto') {
      const val = parseMoney(input.value);
      if (val !== Number(c.monto)) { c.monto = val; await api.updateCuenta(id, { monto: val }); }
    } else {
      const val = input.value.trim();
      if (val && val !== c.nombre) { c.nombre = val; await api.updateCuenta(id, { nombre: val }); }
    }
    renderCuentas();
  };
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { renderCuentas(); }
  });
}
async function deleteCuenta(id) {
  const c = state.cuentas.find(x => String(x.id) === String(id));
  if (!c) return;
  if (!confirm(`¿Eliminar "${c.nombre}"? Se quita de todos los meses.`)) return;
  state.cuentas = state.cuentas.filter(x => String(x.id) !== String(id));
  renderCuentas();
  await api.deleteCuenta(id);
}
async function addCuenta() {
  const nombreEl = document.getElementById('cuenta-add-nombre');
  const montoEl = document.getElementById('cuenta-add-monto');
  const nombre = nombreEl.value.trim();
  if (!nombre) { nombreEl.focus(); return; }
  const monto = parseMoney(montoEl.value);
  const orden = state.cuentas.length;
  const r = await api.createCuenta({ nombre, monto, orden });
  const item = r?.item || { id: uid(), nombre, monto, orden };
  item.pagado = false;
  state.cuentas.push(item);
  nombreEl.value = '';
  montoEl.value = '';
  renderCuentas();
  nombreEl.focus();
}
function cuentasPrevMonth() { state.cuentasMes = shiftMonth(state.cuentasMes, -1); loadCuentas(); }
function cuentasNextMonth() { state.cuentasMes = shiftMonth(state.cuentasMes, 1); loadCuentas(); }

/* ═══════════════════════════════════════════════════════════════
   ESCAPE HTML
   ═══════════════════════════════════════════════════════════════ */
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
async function init() {
  renderHero();
  setInterval(renderHero, 60000);
  await Promise.all([renderAgenda(), loadNotes()]);

  // listeners
  document.getElementById('btn-add-event').addEventListener('click', openAddEventModal);
  document.getElementById('open-past-notes').addEventListener('click', showPastNotesView);
  document.getElementById('back-to-dashboard').addEventListener('click', showDashboardView);
  document.getElementById('pn-search').addEventListener('input', debounce(renderPastNotes, 200));
  document.getElementById('modal-prep').addEventListener('input', saveEventNoteDebounced);
  document.getElementById('modal-during').addEventListener('input', saveEventNoteDebounced);
  const noteInput = document.getElementById('note-add-input');
  const addCurrentNote = () => {
    const val = noteInput.value;
    if (val.trim()) {
      addNote(val);
      noteInput.value = '';
      noteInput.focus();
    }
  };
  noteInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCurrentNote(); } });
  document.getElementById('btn-add-note').addEventListener('click', addCurrentNote);
  document.getElementById('btn-add-longform').addEventListener('click', createLongformNote);

  // Tabs (Hoy / Cuentas)
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  // Cuentas
  document.getElementById('cuentas-prev').addEventListener('click', cuentasPrevMonth);
  document.getElementById('cuentas-next').addEventListener('click', cuentasNextMonth);
  document.getElementById('btn-add-cuenta').addEventListener('click', addCuenta);
  document.getElementById('cuenta-add-nombre').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('cuenta-add-monto').focus(); } });
  document.getElementById('cuenta-add-monto').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCuenta(); } });
  document.getElementById('modal-longform-title').addEventListener('input', saveLongformDebounced);
  document.getElementById('modal-longform-body').addEventListener('input', saveLongformDebounced);
  document.getElementById('btn-delete-longform').addEventListener('click', deleteCurrentLongform);

  // Atajos: notas pasadas desde el panel agenda y notas anteriores desde panel daily
  document.getElementById('agenda-past-notes').addEventListener('click', showPastNotesView);
  document.getElementById('btn-past-daily-notes').addEventListener('click', showPastDailyView);
  document.getElementById('back-from-past-daily').addEventListener('click', showDashboardFromPastDaily);

  // ESC closes modals
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('event-note-modal').classList.contains('open')) closeEventNoteModal();
      if (document.getElementById('add-event-modal').classList.contains('open')) closeAddEventModal();
      if (document.getElementById('longform-note-modal').classList.contains('open')) closeLongformNoteModal();
      if (document.getElementById('past-daily-modal').classList.contains('open')) closePastDailyModal();
    }
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
